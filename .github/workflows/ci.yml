name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "wp*/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: recon_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: recon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recon_app -d recon_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://recon_app:ci-password@localhost:5432/recon_test
      TEST_DATABASE_URL: postgresql+psycopg://recon_app:ci-password@localhost:5432/recon_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format (black)
        run: black --check .
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy strict)
        run: mypy
      - name: Migrate the test database
        run: alembic upgrade head
      - name: Bank configuration validation
        run: |
          for f in config/banks/*.v1.yaml; do
            python -m recon.cli.validate_bank_config "$f" || exit 1
          done
      - name: Golden dataset gate
        run: pytest -q -m golden
      - name: Tests with coverage (floor 80%)
        run: pytest -q --cov=recon --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Types, lint, format, tests
        run: npm run check
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f docker/api.Dockerfile -t recon-api:ci .
      - name: Build the dashboard image
        run: docker build -t recon-web:ci frontend
