[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recon"
version = "0.1.0"
description = "Automated Reconciliation Engine for Multi-Bank Settlement"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.1.18",
    "redis>=5.0",
    "lxml>=5.1",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "structlog>=24.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.9",
    "black>=24.3",
    "ruff>=0.3",
    "pre-commit>=3.7",
    "import-linter>=2.0",
    "types-PyYAML",
    "types-python-dateutil",
    "lxml-stubs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

# ----------------------------------------------------------------------
# black
# ----------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ----------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetime usage
    "T20",         # no print()
    "SIM",         # simplify
    "TID",         # tidy imports
    "ARG",         # unused arguments
    "PL",          # pylint subset
    "RUF",
]
ignore = ["PLR0913"]  # argument count; DI constructors legitimately exceed it

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"src/recon/cli/*" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"decimal.getcontext".msg = "Use the explicit Context in recon.domain.money, never the global context."

# ----------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
show_error_codes = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "jose.*", "passlib.*", "jsonschema.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires PostgreSQL and Redis",
    "performance: long-running benchmark",
    "chaos: injects failures",
    "golden: golden dataset regression gate",
]

[tool.coverage.run]
branch = true
source = ["src/recon"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
